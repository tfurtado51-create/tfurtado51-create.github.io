<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Portal do Antonio</title>
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;700&family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --fla-red: #c0392b;
            --fla-black: #111111;
            --fla-white: #f5f6fa;
            --arcade-glow: 0 0 10px #e74c3c, 0 0 20px #c0392b;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            background-color: var(--fla-black); 
            color: var(--fla-white); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh;
            padding: 30px 20px;
            background-image: 
                linear-gradient(rgba(17, 17, 17, 0.9), rgba(17, 17, 17, 0.9)),
                repeating-linear-gradient(45deg, #111 0, #111 2px, #222 2px, #222 4px);
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        .avatar {
            font-size: 60px;
            margin-bottom: 10px;
            filter: drop-shadow(0 0 15px rgba(192, 57, 43, 0.8));
        }

        h1 { 
            font-family: 'Teko', sans-serif;
            font-size: 48px; 
            letter-spacing: 2px;
            color: var(--fla-white);
            text-transform: uppercase;
            text-shadow: var(--arcade-glow);
            margin-bottom: 5px;
            line-height: 1;
        }

        h2 {
            font-family: 'VT323', monospace;
            font-size: 24px;
            color: #bdc3c7;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .missions-container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }

        .btn-mission {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--fla-red);
            color: var(--fla-white);
            text-decoration: none;
            padding: 15px 25px;
            border-radius: 12px;
            font-family: 'Teko', sans-serif;
            font-size: 30px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: 4px solid #8e1c12;
            box-shadow: 0 6px 0 #7f170e, 0 10px 15px rgba(0,0,0,0.4);
            transition: all 0.1s ease;
            position: relative;
        }

        .btn-mission:active {
            transform: translateY(6px);
            box-shadow: 0 0px 0 #7f170e, 0 4px 8px rgba(0,0,0,0.4);
        }

        .btn-icon { font-size: 30px; }

        /* Cores exclusivas para cada matéria */
        .btn-ciencias { background: #27ae60; border-color: #1e8449; box-shadow: 0 6px 0 #145a32, 0 10px 15px rgba(0,0,0,0.4); }
        .btn-ciencias:active { box-shadow: 0 0px 0 #145a32, 0 4px 8px rgba(0,0,0,0.4); }
        
        .btn-portugues { background: #2980b9; border-color: #1a5276; box-shadow: 0 6px 0 #154360, 0 10px 15px rgba(0,0,0,0.4); }
        .btn-portugues:active { box-shadow: 0 0px 0 #154360, 0 4px 8px rgba(0,0,0,0.4); }

        .btn-historia { background: #d35400; border-color: #873600; box-shadow: 0 6px 0 #6e2c00, 0 10px 15px rgba(0,0,0,0.4); }
        .btn-historia:active { box-shadow: 0 0px 0 #6e2c00, 0 4px 8px rgba(0,0,0,0.4); }

        .btn-geografia { background: #8e44ad; border-color: #5b2c6f; box-shadow: 0 6px 0 #4a235a, 0 10px 15px rgba(0,0,0,0.4); }
        .btn-geografia:active { box-shadow: 0 0px 0 #4a235a, 0 4px 8px rgba(0,0,0,0.4); }

        .btn-ingles { background: #f39c12; border-color: #9c640c; box-shadow: 0 6px 0 #7e5109, 0 10px 15px rgba(0,0,0,0.4); }
        .btn-ingles:active { box-shadow: 0 0px 0 #7e5109, 0 4px 8px rgba(0,0,0,0.4); }

        .footer-text {
            margin-top: auto;
            font-family: 'VT323', monospace;
            font-size: 18px;
            color: #7f8c8d;
        }
    </style>
</head>
<body>

    <header>
        <div class="avatar">🔴⚫🎮</div>
        <h1>Portal do Antonio</h1>
        <h2>Select sua Missão</h2>
    </header>

    <div class="missions-container">
        <a href="matematica.html" class="btn-mission">
            <span>Matemática</span>
            <span class="btn-icon">🧮</span>
        </a>

        <a href="ciencias.html" class="btn-mission btn-ciencias">
            <span>Ciências</span>
            <span class="btn-icon">🔬</span>
        </a>

        <a href="portugues.html" class="btn-mission btn-portugues">
            <span>Português</span>
            <span class="btn-icon">📖</span>
        </a>

        <a href="historia.html" class="btn-mission btn-historia">
            <span>História</span>
            <span class="btn-icon">🏛️</span>
        </a>

        <a href="geografia.html" class="btn-mission btn-geografia">
            <span>Geografia</span>
            <span class="btn-icon">🗺️</span>
        </a>

        <a href="ingles.html" class="btn-mission btn-ingles">
            <span>Inglês</span>
            <span class="btn-icon">💬</span>
        </a>
    </div>

    <div class="footer-text">
        <p>PRESS START TO PLAY</p>
    </div>

</body>
</html>
