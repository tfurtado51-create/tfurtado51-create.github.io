<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Desafio Matemático</title>
    <style>
        :root {
            --primary: #4361ee;
            --success: #2ecc71;
            --danger: #e74c3c;
            --bg: #f8f9fa;
            --card: #ffffff;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg); color: #333; padding: 20px; text-align: center; }
        header { margin-bottom: 20px; }
        h1 { color: var(--primary); font-size: 24px; margin-bottom: 5px; }
        
        /* Views */
        #menu-view, #quiz-view, #reward-view { display: none; }
        .active-view { display: block !important; }

        /* Menu & Ranking */
        .topic-btn {
            background: var(--card); border: 2px solid var(--primary); color: var(--primary);
            padding: 15px; margin: 10px 0; border-radius: 10px; width: 100%;
            font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.2s;
            display: flex; justify-content: space-between; align-items: center;
        }
        .topic-btn:active { transform: scale(0.98); }
        .stats { font-size: 14px; color: #666; font-weight: normal; }
        
        /* Rewards */
        .rewards-container { margin-top: 30px; background: var(--card); padding: 15px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .badge { display: inline-block; padding: 8px 12px; margin: 5px; border-radius: 20px; background: #e0e0e0; color: #888; font-size: 14px; font-weight: bold; }
        .badge.unlocked { background: #f1c40f; color: #000; box-shadow: 0 2px 4px rgba(241, 196, 15, 0.4); }

        /* Quiz UI */
        .card { background: var(--card); padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 20px; min-height: 200px; display: flex; align-items: center; justify-content: center; font-size: 22px; }
        .options { display: grid; grid-template-columns: 1fr; gap: 10px; }
        .option-btn { background: var(--primary); color: white; border: none; padding: 15px; border-radius: 10px; font-size: 18px; cursor: pointer; }
        .option-btn:active { opacity: 0.8; }
        .option-btn.correct { background: var(--success); }
        .option-btn.wrong { background: var(--danger); }
        
        /* Controls & Explanations */
        .control-btn { margin-top: 20px; background: #555; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-size: 16px; width: 100%; cursor: pointer; }
        #explanation { margin-top: 15px; padding: 15px; background: #e9ecef; border-radius: 8px; font-size: 16px; display: none; text-align: left; border-left: 4px solid var(--primary); }
    </style>
</head>
<body>

    <header>
        <h1>Desafio Matemático do Antonio</h1>
        <p id="total-score">Pontos totais: 0</p>
    </header>

    <!-- TELA DE MENU / RANKING -->
    <div id="menu-view" class="active-view">
        <div id="topics-container"></div>
        
        <div class="rewards-container">
            <h3>🏆 Sala de Troféus</h3>
            <div id="badges-container"></div>
        </div>
    </div>
<!-- Botão para ir para Ciências -->
        <a href="ciencias.html" class="control-btn" style="background: #27ae60; text-decoration: none; text-align: center;">🔬 Ir para Ciências</a>
    
    <!-- TELA DE QUIZ (FLASHCARD) -->
    <div id="quiz-view">
        <h2 id="quiz-title" style="margin-bottom: 15px; color: #555;">Tema</h2>
        <div class="card" style="flex-direction: column;">
            <!-- NOVO: Container para imagens/gráficos -->
            <div id="visual-container" style="width: 100%; margin-bottom: 20px; display: flex; justify-content: center; align-items: center; min-height: 50px;"></div>
            
            <div id="question-text">Pergunta vai aqui?</div>
        </div>
        
        <div class="options" id="options-container"></div>
        
        <div id="explanation"></div>
        
        <button class="control-btn" id="btn-explanation" onclick="showExplanation()" style="display:none; background: #f39c12;">💡 Ver Explicação</button>
        <button class="control-btn" id="btn-next" onclick="nextQuestion()" style="display:none; background: var(--success);">Próxima Questão ➔</button>
        <button class="control-btn" onclick="showMenu()" style="background: #95a5a6; margin-top: 10px;">Voltar ao Menu</button>
    </div>

    <script>
        // 1. BANCO DE DADOS HÍBRIDO (Estáticas + Geradores Dinâmicos)
const db = {
    fracoes: {
        title: "Frações",
        questions: [
            // QUESTÕES VISUAIS DE FRAÇÕES
            { 
                q: "Que fração a parte colorida da barra representa?", 
                visual: `<div style="display: flex; width: 80%; height: 40px; border: 3px solid #333; border-radius: 5px; overflow: hidden;">
                            <div style="flex: 1; background: #4361ee; border-right: 2px solid #333;"></div>
                            <div style="flex: 1; background: #4361ee; border-right: 2px solid #333;"></div>
                            <div style="flex: 1; background: #4361ee; border-right: 2px solid #333;"></div>
                            <div style="flex: 1; background: #fff;"></div>
                         </div>`,
                options: ["1/4", "3/4", "4/3", "1/3"], 
                answer: 1, 
                exp: "A barra está dividida em 4 pedaços iguais (denominador 4). 3 desses pedaços estão pintados de azul (numerador 3). Logo, 3/4." 
            },
            { 
                q: "Se você comer a parte colorida desta pizza, que fração você comeu?", 
                visual: `<svg width="100" height="100" viewBox="0 0 32 32">
                            <circle r="16" cx="16" cy="16" fill="white" stroke="#333" stroke-width="1"></circle>
                            <circle r="8" cx="16" cy="16" fill="transparent" stroke="#e74c3c" stroke-width="16" stroke-dasharray="12.56 50.24"></circle>
                            <line x1="16" y1="0" x2="16" y2="32" stroke="#333" stroke-width="1"></line>
                            <line x1="0" y1="16" x2="32" y2="16" stroke="#333" stroke-width="1"></line>
                         </svg>`,
                options: ["1/2", "3/4", "1/4", "4/4"], 
                answer: 2, 
                exp: "A pizza foi dividida em 4 pedaços e apenas 1 está colorido de vermelho. Isso representa 1/4 (um quarto)." 
            },
            { q: "Como lemos a fração 3/4?", options: ["Três quartos", "Três e quatro", "Quarto e três", "Trinta e quatro"], answer: 0, exp: "O número de cima (numerador) lemos normalmente como 'três'. O de baixo (denominador) lemos como 'quartos'. Logo, três quartos." },
            { q: "Qual fração representa a metade de um chocolate?", options: ["1/4", "2/3", "1/2", "1/3"], answer: 2, exp: "A metade significa dividir o inteiro em 2 partes e pegar 1. Portanto, 1/2." },
            { q: "Como se escreve 'cinco oitavos' em fração?", options: ["8/5", "5/8", "58", "5/10"], answer: 1, exp: "O numerador é 5 (em cima) e o denominador é 8 (em baixo), indicando que o inteiro foi dividido em 8 partes e pegamos 5." },
            { q: "Qual fração representa um inteiro completo, ou seja, uma pizza inteira que foi cortada em 4 pedaços?", options: ["1/4", "3/4", "4/4", "2/4"], answer: 2, exp: "Se a pizza foi cortada em 4 pedaços e você tem todos eles, você tem 4 pedaços de 4 totais (4/4), que equivale a 1 inteiro." },
            { q: "O que é maior: 3/5 ou 1/5?", options: ["3/5", "1/5", "São iguais", "Depende"], answer: 0, exp: "Como os denominadores (5) são iguais, os pedaços têm o mesmo tamanho. Ter 3 pedaços é mais do que ter apenas 1." },
            { q: "Qual é o resultado da adição 2/7 + 3/7?", options: ["5/14", "6/7", "5/7", "1/7"], answer: 2, exp: "Na adição com o mesmo denominador, mantemos o número de baixo (7) e somamos apenas os de cima (2 + 3 = 5)." },
            { q: "Resolva a subtração: 8/9 - 4/9", options: ["12/9", "4/0", "4/9", "4/18"], answer: 2, exp: "Mantemos o denominador (9) e subtraímos apenas os numeradores (8 - 4 = 4). O resultado é 4/9." },
            { q: "Qual fração é equivalente a 1/2?", options: ["2/4", "1/4", "3/8", "2/3"], answer: 0, exp: "Se você multiplicar o número de cima e o de baixo de 1/2 por 2, obterá 2/4. Ambas representam a mesma quantidade (a metade)." },
            { q: "O que significa uma fração como 5/4?", options: ["É menor que um inteiro", "É exatamente um inteiro", "É maior que um inteiro", "É igual a 1/4"], answer: 2, exp: "Como o numerador (5) é maior que o denominador (4), significa que você tem mais do que 4 pedaços necessários para formar 1 inteiro. Logo, é maior que um inteiro." },
            { q: "Qual fração é equivalente a 2/3?", options: ["4/9", "3/2", "4/6", "2/6"], answer: 2, exp: "Multiplicando o numerador (2) e o denominador (3) por 2, temos 4/6. As duas frações representam o mesmo tamanho." },
            { q: "Quanto é 1/4 de 40 reais?", options: ["4 reais", "10 reais", "20 reais", "40 reais"], answer: 1, exp: "Para achar 1/4, dividimos o total pelo denominador (40 ÷ 4 = 10) e multiplicamos pelo numerador (10 × 1 = 10)." },
            { q: "Quanto é 2/5 de 20 bolinhas?", options: ["4 bolinhas", "8 bolinhas", "10 bolinhas", "15 bolinhas"], answer: 1, exp: "Primeiro dividimos pelo de baixo: 20 ÷ 5 = 4. Depois, multiplicamos pelo de cima: 4 × 2 = 8 bolinhas." },
            { q: "O Antonio comeu 3/8 de uma pizza e o seu irmão comeu 2/8. Quanto sobrou da pizza?", options: ["5/8", "3/8", "1/8", "8/8"], answer: 1, exp: "Eles comeram juntos 5/8 (3/8 + 2/8). A pizza inteira é 8/8. Subtraindo o que comeram (8/8 - 5/8), sobram 3/8." },
            { q: "Se eu li 1/3 de um livro de 90 páginas, quantas páginas eu já li?", options: ["30", "60", "90", "10"], answer: 0, exp: "Dividimos o total de páginas por 3 (90 ÷ 3 = 30) e multiplicamos por 1. Você leu 30 páginas." },
            { q: "Coloque em ordem crescente (do menor para o maior): 1/6, 5/6, 3/6.", options: ["5/6, 3/6, 1/6", "1/6, 5/6, 3/6", "3/6, 1/6, 5/6", "1/6, 3/6, 5/6"], answer: 3, exp: "Com denominadores iguais, olhamos os numeradores: 1 é o menor, 3 é o do meio, e 5 é o maior." },
            { q: "Qual dessas frações é a MAIOR?", options: ["1/8", "1/2", "1/4", "1/6"], answer: 1, exp: "Quando o numerador é igual (1), a fração com o MENOR denominador é a maior. Logo, 1/2 (a metade) é a maior." },
            { q: "Resolva: (3/10 + 4/10) - 2/10", options: ["9/10", "1/10", "5/10", "7/10"], answer: 2, exp: "Primeiro somamos: 3 + 4 = 7. A conta fica 7/10 - 2/10. Subtraindo: 7 - 2 = 5. Resultado: 5/10." },
            { q: "Uma caixa tem 24 lápis. 3/4 deles são coloridos. Quantos lápis coloridos há na caixa?", options: ["6", "12", "18", "24"], answer: 2, exp: "Dividimos 24 por 4 = 6. Multiplicamos por 3 = 18 lápis coloridos." },
            { q: "Qual destas frações NÃO é equivalente a 1/2?", options: ["2/4", "5/10", "4/8", "3/5"], answer: 3, exp: "2/4, 5/10 e 4/8 representam a metade. 3/5 representa mais da metade, então não é equivalente." },
            { q: "Se 4/4 é igual a 1 inteiro, o que é 8/4?", options: ["1 inteiro", "2 inteiros", "4 inteiros", "8 inteiros"], answer: 1, exp: "Cada grupo de 4 quartos forma 1 inteiro. Como você tem 8 quartos, você tem 2 inteiros completos (8 ÷ 4 = 2)." }
        ],
        generators: [
            function() { // Gerador de Adição de Frações
                let den = Math.floor(Math.random() * 8) + 3; 
                let n1 = Math.floor(Math.random() * 5) + 1;
                let n2 = Math.floor(Math.random() * 5) + 1;
                let soma = n1 + n2;
                let ans = `${soma}/${den}`;
                let err1 = `${soma}/${den * 2}`; 
                let err2 = `${Math.abs(n1 - n2) || 1}/${den}`; 
                let err3 = `${soma + 1}/${den}`;
                let opcoes = [ans, err1, err2, err3].sort(() => Math.random() - 0.5);
                return {
                    q: `Qual é o resultado da adição ${n1}/${den} + ${n2}/${den}?`,
                    options: opcoes, answer: opcoes.indexOf(ans),
                    exp: `Mantemos o denominador (${den}) e somamos apenas os numeradores (${n1} + ${n2} = ${soma}).`
                };
            }
            ,function() { // Gerador Visual Dinâmico de Frações (Barras)
                let den = Math.floor(Math.random() * 5) + 3; // Sorteia de 3 a 7 pedaços
                let num = Math.floor(Math.random() * (den - 1)) + 1; // Sorteia quantos estão pintados
                
                // O código abaixo desenha a barra dinamicamente
                let barrasHTML = '';
                for(let i = 0; i < den; i++) {
                    let cor = (i < num) ? '#2ecc71' : '#fff'; // Pinta de verde ou deixa branco
                    barrasHTML += `<div style="flex: 1; background: ${cor}; border-right: 1px solid #333;"></div>`;
                }
                let visualCode = `<div style="display: flex; width: 80%; height: 40px; border: 3px solid #333; border-radius: 5px; overflow: hidden;">${barrasHTML}</div>`;
                
                let ans = `${num}/${den}`;
                let err1 = `${num + 1}/${den}`;
                let err2 = `${num}/${den + 1}`;
                let err3 = `${den}/${num}`; // Invertido
                
                let opcoes = [ans, err1, err2, err3];
                opcoes = [...new Set(opcoes)]; // Remove duplicadas se houver
                while(opcoes.length < 4) opcoes.push(`${Math.floor(Math.random()*3)+1}/${den+2}`); // Garante 4 opções
                opcoes.sort(() => Math.random() - 0.5);
                
                return {
                    q: "Que fração a parte pintada de verde representa?",
                    visual: visualCode,
                    options: opcoes, 
                    answer: opcoes.indexOf(ans),
                    exp: `A barra inteira foi dividida em ${den} pedaços (denominador). Temos ${num} pedaços pintados (numerador). Logo, a fração é ${ans}.`
                };
            }
        ]
    },
    medidas: {
        title: "Combinações e Medidas",
        questions: [
            // QUESTÃO VISUAL DE COMBINAÇÕES
            { 
                q: "O Antonio tem essas opções de roupas. Quantas combinações diferentes (1 blusa + 1 calça) ele pode fazer?", 
                visual: `<div style="font-size: 40px; text-align: center;">
                            <div>👕 👕 👕</div>
                            <div style="margin-top: 10px;">👖 👖</div>
                         </div>`,
                options: ["3", "5", "6", "9"], 
                answer: 2, 
                exp: "Temos 3 blusas e 2 calças. Para saber as combinações, multiplicamos: 3 x 2 = 6." 
            },
            { q: "Quantos centímetros (cm) formam 1 metro (m)?", options: ["10 cm", "100 cm", "1000 cm", "1 cm"], answer: 1, exp: "O prefixo 'centi' significa centésima parte. Logo, 1 metro possui exatamente 100 centímetros." },
            { q: "Para medir a distância entre duas cidades, qual unidade usamos?", options: ["Centímetro (cm)", "Metro (m)", "Quilômetro (km)", "Milímetro (mm)"], answer: 2, exp: "Usamos o Quilômetro (km) para medir grandes distâncias." },
            { q: "Quantos gramas (g) tem 1 quilograma (kg)?", options: ["10 g", "100 g", "1000 g", "10000 g"], answer: 2, exp: "O prefixo 'quilo' significa mil. Portanto, 1 quilograma equivale a 1000 gramas." },
            { q: "Para medir a quantidade de água em uma piscina, qual unidade faz sentido?", options: ["Miligrama (mg)", "Quilograma (kg)", "Metro (m)", "Litro (L)"], answer: 3, exp: "O Litro (L) é a unidade usada para medir capacidade, líquidos." },
            { q: "Se eu tenho 2 calças e 4 camisas, quantas combinações diferentes posso vestir?", options: ["6", "8", "12", "2"], answer: 1, exp: "Para achar as combinações, multiplicamos as opções: 2 calças × 4 camisas = 8 combinações." },
            { q: "Uma régua comum de escola costuma ter 30 cm. Quantos milímetros (mm) isso representa?", options: ["3 mm", "30 mm", "300 mm", "3000 mm"], answer: 2, exp: "Cada 1 centímetro tem 10 milímetros. Então, 30 × 10 = 300 milímetros." },
            { q: "Um pacote de arroz pesa 5 kg. Quantos gramas ele tem?", options: ["50 g", "500 g", "5000 g", "50000 g"], answer: 2, exp: "Como 1 kg tem 1000 g, multiplicamos 5 por 1000, o que dá 5000 gramas." },
            { q: "Quantos mililitros (ml) formam 1 litro (L)?", options: ["10 ml", "100 ml", "1000 ml", "10000 ml"], answer: 2, exp: "O prefixo 'mili' significa milésima parte. Logo, 1 Litro tem 1000 mililitros." },
            { q: "O Gael bebeu 2 copinhos de suco de 250 ml cada. Quanto ele bebeu no total?", options: ["250 ml", "500 ml", "1 Litro", "750 ml"], answer: 1, exp: "Somamos a capacidade dos dois copinhos: 250 ml + 250 ml = 500 ml (meio litro)." },
            { q: "Para comprar um carro, há 3 opções de cores e 3 modelos diferentes. Quantas combinações existem?", options: ["6", "9", "3", "12"], answer: 1, exp: "Multiplicamos as opções de cores pelos modelos: 3 × 3 = 9 combinações diferentes." },
            { q: "O que é mais longo: 2 metros ou 250 centímetros?", options: ["2 metros", "250 centímetros", "São iguais", "Depende"], answer: 1, exp: "2 metros equivalem a 200 centímetros. Como 250 cm é maior que 200 cm, 250 centímetros é mais longo." },
            { q: "O Antonio tem uma corda de 1 metro e 20 centímetros. Quantos centímetros ela tem ao todo?", options: ["12 cm", "120 cm", "1020 cm", "10020 cm"], answer: 1, exp: "1 metro é igual a 100 centímetros. Somando 100 cm com os 20 cm restantes, temos 120 centímetros." },
            { q: "Se eu juntar duas barras de chocolate que pesam 500 gramas cada, qual será o peso total?", options: ["1 kg", "500 g", "100 g", "2 kg"], answer: 0, exp: "500g + 500g = 1000 gramas. E sabemos que 1000 gramas formam exatamente 1 Quilograma (1 kg)." },
            { q: "Uma garrafa tem 2 Litros de refrigerante. Quantos copos de 200 ml conseguimos encher?", options: ["5", "10", "15", "20"], answer: 1, exp: "2 Litros equivalem a 2000 ml. Dividindo 2000 ml por 200 ml, conseguimos encher 10 copos." },
            { q: "Se você tem 4 pães diferentes, 3 tipos de queijo e 2 tipos de presunto, quantos sanduíches únicos pode montar escolhendo um de cada?", options: ["9", "12", "24", "48"], answer: 2, exp: "Multiplicamos todas as opções juntas: 4 pães × 3 queijos × 2 presuntos = 24 combinações." },
            { q: "O que é mais pesado: 1 kg de algodão ou 1000 g de chumbo?", options: ["Algodão", "Chumbo", "Têm o mesmo peso", "Impossível saber"], answer: 2, exp: "1 kg é exatamente igual a 1000 g, independentemente do material." },
            { q: "Se um remédio recomenda tomar 5 mg, e o comprimido tem 1 grama (g), isso significa que:", options: ["O comprimido tem menos que a dose", "O comprimido tem exatamente a dose", "O comprimido tem muito mais (1000 mg)", "Faltam dados"], answer: 2, exp: "1 grama equivale a 1000 miligramas (mg). Então um comprimido de 1g é 200 vezes maior que a dose de 5mg." },
            { q: "Uma pista de corrida tem 3 km de extensão. Se um piloto der 4 voltas, quantos metros ele percorreu?", options: ["12 m", "120 m", "1200 m", "12000 m"], answer: 3, exp: "Primeiro, 3 km = 3000 metros. Fazemos 3000 × 4 = 12000 metros." },
            { q: "Quantas opções de lanches rápidos posso montar se há 5 sabores de salgado e eu posso escolher com ou sem ketchup?", options: ["5", "7", "10", "15"], answer: 2, exp: "'Com ou sem' são 2 opções. 5 sabores × 2 opções = 10 combinações." },
            { q: "Se uma receita pede 1,5 kg de farinha, quantos gramas você deve usar?", options: ["15 g", "150 g", "1500 g", "15000 g"], answer: 2, exp: "1 kg tem 1000 g e 0,5 kg tem 500 g. Somando, temos 1500 gramas." }
        ],
        generators: [
           function() { // Super Gerador Dinâmico de Conversões (Várias unidades)
                const tipos = [
                    { de: "kg", para: "g", mult: 1000, nome: "Um pacote pesa", singular: "quilo" },
                    { de: "km", para: "m", mult: 1000, nome: "Uma estrada tem", singular: "quilômetro" },
                    { de: "m", para: "cm", mult: 100, nome: "Uma corda tem", singular: "metro" },
                    { de: "L", para: "ml", mult: 1000, nome: "Uma garrafa tem", singular: "litro" }
                ];
                let tipo = tipos[Math.floor(Math.random() * tipos.length)]; // Sorteia o tipo de medida
                let valor = Math.floor(Math.random() * 9) + 2; 
                let ans = valor * tipo.mult;
                
                let err1 = valor * (tipo.mult / 10);
                let err2 = valor * (tipo.mult * 10);
                let err3 = ans + tipo.mult;
                
                let opcoes = [`${ans} ${tipo.para}`, `${err1} ${tipo.para}`, `${err2} ${tipo.para}`, `${err3} ${tipo.para}`];
                opcoes = [...new Set(opcoes)];
                while(opcoes.length < 4) opcoes.push(`${ans + (tipo.mult * 2)} ${tipo.para}`);
                opcoes.sort(() => Math.random() - 0.5);
                
                return {
                    q: `${tipo.nome} ${valor} ${tipo.de}. Quantos ${tipo.para} isso representa?`,
                    options: opcoes, answer: opcoes.indexOf(`${ans} ${tipo.para}`),
                    exp: `Cada 1 ${tipo.singular} equivale a ${tipo.mult} ${tipo.para}. Portanto, multiplicamos ${valor} por ${tipo.mult}, resultando em ${ans} ${tipo.para}.`
                };
            },
            function() { // Super Gerador Visual de Combinações (Vários Emojis)
                const temas = [
                    { e1: '👕', e2: '👖', t1: 'camisas', t2: 'calças', acao: 'vestir' },
                    { e1: '🍔', e2: '🥤', t1: 'lanches', t2: 'bebidas', acao: 'pedir' },
                    { e1: '⚽', e2: '👟', t1: 'bolas', t2: 'chuteiras', acao: 'usar' },
                    { e1: '🚗', e2: '🛣️', t1: 'carros', t2: 'caminhos', acao: 'escolher' }
                ];
                let tema = temas[Math.floor(Math.random() * temas.length)]; // Sorteia o emoji e o texto
                let q1 = Math.floor(Math.random() * 4) + 2; 
                let q2 = Math.floor(Math.random() * 3) + 2; 
                
                let visualCode = `<div style="font-size: 35px; text-align: center; background: #eef2f3; padding: 10px; border-radius: 10px;">
                                    <div>${(tema.e1 + ' ').repeat(q1)}</div>
                                    <div style="margin-top: 10px;">${(tema.e2 + ' ').repeat(q2)}</div>
                                 </div>`;
                
                let ans = q1 * q2;
                let err1 = q1 + q2; 
                let err2 = ans + 2;
                let err3 = ans - 2 || 1;
                
                let opcoes = [ans.toString(), err1.toString(), err2.toString(), err3.toString()];
                opcoes = [...new Set(opcoes)];
                while(opcoes.length < 4) opcoes.push((ans + 3).toString());
                opcoes.sort(() => Math.random() - 0.5);
                
                return {
                    q: `Temos ${q1} ${tema.t1} e ${q2} ${tema.t2}. Quantas combinações diferentes podemos ${tema.acao}?`,
                    visual: visualCode,
                    options: opcoes, answer: opcoes.indexOf(ans.toString()),
                    exp: `Multiplicamos as opções: ${q1} ${tema.t1} × ${q2} ${tema.t2} = ${ans} combinações.`
                };
            }
        ]
    },
    multiplos: {
        title: "Múltiplos e Divisores",
        questions: [
            { q: "Quais são os 3 primeiros múltiplos de 2 (diferentes de zero)?", options: ["1, 2, 3", "2, 4, 6", "2, 3, 4", "4, 6, 8"], answer: 1, exp: "Os múltiplos de 2 vêm da tabuada do 2. Assim: 2x1=2, 2x2=4 e 2x3=6." },
            { q: "Quais destes números são múltiplos de 10?", options: ["15, 20, 25", "10, 20, 30", "1, 10, 100", "5, 10, 15"], answer: 1, exp: "Múltiplos de 10 sempre terminam em zero: 10, 20, 30, 40, etc." },
            { q: "O número 15 é múltiplo de qual destes números?", options: ["2", "4", "5", "6"], answer: 2, exp: "Na tabuada do 5 temos o 15 (5 × 3 = 15). Portanto, 15 é múltiplo de 5." },
            { q: "Se você quer dividir 10 balas igualmente, não pode sobrar nenhuma. Qual número é divisor de 10?", options: ["3", "4", "5", "6"], answer: 2, exp: "O número 5 divide o 10 perfeitamente (10 ÷ 5 = 2)." },
            { q: "Quais são TODOS os divisores de 8?", options: ["1, 2, 4, 8", "2, 4, 8", "1, 8", "2, 4"], answer: 0, exp: "O 8 pode ser dividido perfeitamente por 1, por 2, por 4 e por 8." },
            { q: "O número 24 é múltiplo de 6?", options: ["Sim, porque 6 x 4 = 24", "Não, é múltiplo de 5", "Sim, porque 6 x 3 = 24", "Não, o 24 só é múltiplo de 2"], answer: 0, exp: "Como a multiplicação de 6 por 4 resulta perfeitamente em 24, dizemos que 24 é múltiplo de 6." },
            { q: "Qual destes números é um divisor de 20?", options: ["3", "6", "8", "4"], answer: 3, exp: "20 divide por 4 (20 ÷ 4 = 5)." },
            { q: "Encontre um múltiplo comum aos números 2 e 3.", options: ["4", "5", "6", "8"], answer: 2, exp: "Múltiplos de 2: 2, 4, 6... Múltiplos de 3: 3, 6, 9... O 6 aparece nas duas listas." },
            { q: "Quais são os 4 primeiros múltiplos de 5 (diferentes de zero)?", options: ["5, 10, 15, 20", "1, 5, 10, 15", "10, 20, 30, 40", "5, 6, 7, 8"], answer: 0, exp: "Basta seguir a tabuada do 5: 5x1=5, 5x2=10, 5x3=15 e 5x4=20." },
            { q: "Qual é o maior divisor do número 12 (sem contar ele mesmo)?", options: ["2", "4", "6", "8"], answer: 2, exp: "Os divisores de 12 são: 1, 2, 3, 4, 6 e 12. Tirando o 12, o maior é o 6." },
            { q: "Qual é o menor múltiplo comum (MMC) entre 4 e 6 (diferente de zero)?", options: ["10", "12", "24", "2"], answer: 1, exp: "Múltiplos de 4: 4, 8, 12... Múltiplos de 6: 6, 12... O menor que aparece em ambas é o 12." },
            { q: "Qual é o maior divisor comum (MDC) entre 10 e 15?", options: ["1", "3", "5", "10"], answer: 2, exp: "Divisores de 10: 1, 2, 5, 10. Divisores de 15: 1, 3, 5, 15. O maior em comum é o 5." },
            { q: "O número 7 tem apenas dois divisores. Quais são eles?", options: ["1 e 7", "2 e 7", "3 e 4", "Não tem divisores"], answer: 0, exp: "Números que só podem ser divididos por 1 e por eles mesmos (como o 7) são chamados de números primos." },
            { q: "Se eu tenho 24 figurinhas e quero dividi-las em pacotes iguais sem sobrar nenhuma, qual tamanho de pacote NÃO é possível?", options: ["Pacotes de 4", "Pacotes de 6", "Pacotes de 5", "Pacotes de 8"], answer: 2, exp: "24 não é divisível por 5 (sobrariam figurinhas)." },
            { q: "Qual destes números é, ao mesmo tempo, múltiplo de 3 e de 5?", options: ["10", "12", "15", "20"], answer: 2, exp: "O 15 é 3x5, logo está nas duas tabuadas." },
            { q: "Verdadeiro ou Falso: Todo número par é múltiplo de 2.", options: ["Falso, só até o 10", "Verdadeiro", "Falso, alguns são ímpares", "Depende do número"], answer: 1, exp: "Sim! Todos os números pares podem ser divididos por 2 sem deixar resto." },
            { q: "Qual é o único número par que tem APENAS dois divisores (é primo)?", options: ["4", "6", "8", "2"], answer: 3, exp: "O número 2 só pode ser dividido por 1 e por ele mesmo (2)." },
            { q: "Qual é um divisor comum entre 20 e 30?", options: ["4", "10", "15", "6"], answer: 1, exp: "Tanto 20 quanto 30 terminam em zero, logo podem ser divididos perfeitamente por 10." },
            { q: "Quantos divisores no total tem o número 9?", options: ["2 (1, 9)", "3 (1, 3, 9)", "4 (1, 3, 6, 9)", "Apenas o 3"], answer: 1, exp: "O número 9 pode ser dividido por 1, por 3 e por 9. Portanto, possui exatamente 3 divisores." },
            { q: "Se de 4 em 4 dias chove, e hoje choveu (dia 0). Em qual destes dias vai chover novamente?", options: ["Dia 10", "Dia 12", "Dia 14", "Dia 15"], answer: 1, exp: "Os dias de chuva são múltiplos de 4 (4, 8, 12, 16...). O 12 faz parte dessa lista." }
        ],
        generators: [
            function() { // Gerador de Múltiplos Aleatórios
                let base = Math.floor(Math.random() * 7) + 3; 
                let mult = Math.floor(Math.random() * 8) + 2; 
                let ans = base * mult;
                let err1 = ans + base;
                let err2 = ans - base || base;
                let err3 = ans + 1;
                let opcoes = [ans.toString(), err1.toString(), err2.toString(), err3.toString()].sort(() => Math.random() - 0.5);
                return {
                    q: `Qual destas opções é um múltiplo de ${base}?`,
                    options: opcoes, answer: opcoes.indexOf(ans.toString()),
                    exp: `O número ${ans} está na tabuada do ${base}, pois ${base} x ${mult} = ${ans}.`
                };
            }
        ]
    }
};

// 2. SISTEMA DE METAS E RECOMPENSAS
const goals = [
    { id: "first_blood", req: 1, name: "🌟 Primeiro Acerto!" },
    { id: "math_apprentice", req: 10, name: "📚 Aprendiz de Matemática (10 acertos)" },
    { id: "math_ninja", req: 50, name: "🥷 Ninja dos Números (50 acertos)" },
    { id: "math_master", req: 100, name: "👑 Mestre Calculista (100 acertos)" } 
];

// 3. LÓGICA DE ESTADO E STORAGE
let progress = JSON.parse(localStorage.getItem('mathProgress')) || {};
let currentTopic = '';
let currentQuestionObj = null; // Guarda a pergunta gerada ou sorteada
let questionsAnswered = 0;
const QUESTIONS_PER_ROUND = 10; // O Antonio responde 10 perguntas antes de voltar ao menu
let hasAnswered = false;

function initApp() {
    const container = document.getElementById('topics-container');
    container.innerHTML = '';
    let totalCorrect = 0;

    for (const key in db) {
        if (!progress[key]) progress[key] = { correct: 0, wrong: 0 };
        totalCorrect += progress[key].correct;
        
        const btn = document.createElement('button');
        btn.className = 'topic-btn';
        btn.innerHTML = `${db[key].title} <span class="stats">✅ ${progress[key].correct} | ❌ ${progress[key].wrong}</span>`;
        btn.onclick = () => startTopic(key);
        container.appendChild(btn);
    }
    
    document.getElementById('total-score').innerText = `Acertos Totais: ${totalCorrect}`;
    renderBadges(totalCorrect);
}

function renderBadges(totalCorrect) {
    const container = document.getElementById('badges-container');
    container.innerHTML = '';
    goals.forEach(g => {
        const badge = document.createElement('span');
        badge.className = `badge ${totalCorrect >= g.req ? 'unlocked' : ''}`;
        badge.innerText = g.name;
        container.appendChild(badge);
    });
}

function saveProgress() {
    localStorage.setItem('mathProgress', JSON.stringify(progress));
}

// 4. LÓGICA DO QUIZ HÍBRIDO


// VARIÁVEL NOVA: Guarda as 10 questões únicas da rodada atual
let currentRoundDeck = []; 

function startTopic(key) {
    currentTopic = key;
    questionsAnswered = 0;
    currentRoundDeck = [];
    
    // 1. Verifica se a memória de acertos existe
    if (!progress[key].acertadas) progress[key].acertadas = [];
    
    // 2. Separa apenas as questões de texto que ele AINDA NÃO acertou
    let allStatic = [...db[key].questions];
    let unseenStatic = allStatic.filter(q => !progress[key].acertadas.includes(q.q));
    
    // 3. CORREÇÃO: Só apaga a memória se ele REALMENTE tiver zerado TODAS as questões de texto
    if (unseenStatic.length === 0) {
        progress[key].acertadas = [];
        unseenStatic = [...allStatic];
    }
    
    unseenStatic.sort(() => Math.random() - 0.5); // Embaralha as de texto
    let hasGenerators = db[key].generators && db[key].generators.length > 0;
    
    // 4. CORREÇÃO: Monta o Baralho verificando duplicatas ativamente
    while (currentRoundDeck.length < QUESTIONS_PER_ROUND) {
        let newQuestion = null;
        
        // Usa o robô se as de texto acabaram, OU com 30% de chance se ainda tiver de texto
        let useDynamic = hasGenerators && (unseenStatic.length === 0 || Math.random() < 0.30);
        
        if (useDynamic) {
            let genIndex = Math.floor(Math.random() * db[key].generators.length);
            newQuestion = db[key].generators[genIndex]();
        } else {
            if (unseenStatic.length === 0) {
                // Segurança caso zere a lista no meio da montagem da rodada
                unseenStatic = [...allStatic].sort(() => Math.random() - 0.5);
                progress[key].acertadas = []; 
            }
            newQuestion = unseenStatic.pop();
        }
        
        // VERIFICAÇÃO DE REPETIÇÃO NA MESMA RODADA:
        let isDuplicate = currentRoundDeck.some(q => q.q === newQuestion.q);
        
        if (!isDuplicate) {
            currentRoundDeck.push(newQuestion); // Se for inédita na rodada, entra no baralho
        } else {
            // Se for repetida e for de texto, devolve para a pilha para sortear de novo depois
            if (!useDynamic) unseenStatic.unshift(newQuestion); 
        }
    }
    
    document.getElementById('menu-view').classList.remove('active-view');
    document.getElementById('quiz-view').classList.add('active-view');
    document.getElementById('quiz-title').innerText = `${db[key].title} (Rodada de 10)`;
    loadQuestion();
}

function loadQuestion() {
    hasAnswered = false;
    currentQuestionObj = currentRoundDeck[questionsAnswered]; 
    
    document.getElementById('question-text').innerText = currentQuestionObj.q;
    
    const visualDiv = document.getElementById('visual-container');
    visualDiv.innerHTML = currentQuestionObj.visual ? currentQuestionObj.visual : '';
    visualDiv.style.display = currentQuestionObj.visual ? 'flex' : 'none';
    
    document.getElementById('explanation').style.display = 'none';
    document.getElementById('btn-explanation').style.display = 'none';
    document.getElementById('btn-next').style.display = 'none';
    
    const optionsDiv = document.getElementById('options-container');
    optionsDiv.innerHTML = '';
    
    currentQuestionObj.options.forEach((opt, index) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = opt;
        btn.onclick = () => checkAnswer(index, btn);
        optionsDiv.appendChild(btn);
    });
}

function checkAnswer(selectedIndex, btnElement) {
    if (hasAnswered) return;
    hasAnswered = true;
    
    const isCorrect = selectedIndex === currentQuestionObj.answer;
    const options = document.getElementById('options-container').children;

    if (isCorrect) {
        btnElement.classList.add('correct');
        progress[currentTopic].correct++;
        
        // NOVO: Se ele acertou, guardamos a pergunta na memória para não repetir tão cedo
        if (!progress[currentTopic].acertadas) progress[currentTopic].acertadas = [];
        if (!progress[currentTopic].acertadas.includes(currentQuestionObj.q)) {
            progress[currentTopic].acertadas.push(currentQuestionObj.q);
        }
        
    } else {
        btnElement.classList.add('wrong');
        options[currentQuestionObj.answer].classList.add('correct'); 
        progress[currentTopic].wrong++;
        // Como ele errou, NÃO salvamos em 'acertadas'. Ela vai voltar nas próximas rodadas!
    }

    saveProgress();
    questionsAnswered++;
    
    document.getElementById('btn-explanation').style.display = 'block';
    
    const btnNext = document.getElementById('btn-next');
    btnNext.innerText = questionsAnswered >= QUESTIONS_PER_ROUND ? "Finalizar Rodada ➔" : "Próxima Questão ➔";
    btnNext.style.display = 'block';
}

function showExplanation() {
    const expDiv = document.getElementById('explanation');
    expDiv.innerText = currentQuestionObj.exp;
    expDiv.style.display = 'block';
    document.getElementById('btn-explanation').style.display = 'none';
}

function nextQuestion() {
    if (questionsAnswered < QUESTIONS_PER_ROUND) {
        loadQuestion();
    } else {
        showMenu();
    }
}

function showMenu() {
    document.getElementById('quiz-view').classList.remove('active-view');
    document.getElementById('menu-view').classList.add('active-view');
    initApp();
}

initApp();
    </script>
