<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Desafio Matemático</title>
    <style>
        :root {
            --primary: #4361ee;
            --success: #2ecc71;
            --danger: #e74c3c;
            --bg: #f8f9fa;
            --card: #ffffff;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg); color: #333; padding: 20px; text-align: center; }
        header { margin-bottom: 20px; }
        h1 { color: var(--primary); font-size: 24px; margin-bottom: 5px; }
        
        /* Views */
        #menu-view, #quiz-view, #reward-view { display: none; }
        .active-view { display: block !important; }

        /* Menu & Ranking */
        .topic-btn {
            background: var(--card); border: 2px solid var(--primary); color: var(--primary);
            padding: 15px; margin: 10px 0; border-radius: 10px; width: 100%;
            font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.2s;
            display: flex; justify-content: space-between; align-items: center;
        }
        .topic-btn:active { transform: scale(0.98); }
        .stats { font-size: 14px; color: #666; font-weight: normal; }
        
        /* Rewards */
        .rewards-container { margin-top: 30px; background: var(--card); padding: 15px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .badge { display: inline-block; padding: 8px 12px; margin: 5px; border-radius: 20px; background: #e0e0e0; color: #888; font-size: 14px; font-weight: bold; }
        .badge.unlocked { background: #f1c40f; color: #000; box-shadow: 0 2px 4px rgba(241, 196, 15, 0.4); }

        /* Quiz UI */
        .card { background: var(--card); padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 20px; min-height: 200px; display: flex; align-items: center; justify-content: center; font-size: 22px; }
        .options { display: grid; grid-template-columns: 1fr; gap: 10px; }
        .option-btn { background: var(--primary); color: white; border: none; padding: 15px; border-radius: 10px; font-size: 18px; cursor: pointer; }
        .option-btn:active { opacity: 0.8; }
        .option-btn.correct { background: var(--success); }
        .option-btn.wrong { background: var(--danger); }
        
        /* Controls & Explanations */
        .control-btn { margin-top: 20px; background: #555; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-size: 16px; width: 100%; cursor: pointer; }
        #explanation { margin-top: 15px; padding: 15px; background: #e9ecef; border-radius: 8px; font-size: 16px; display: none; text-align: left; border-left: 4px solid var(--primary); }
    </style>
</head>
<body>

    <header>
        <h1>Desafio Matemático do Antonio</h1>
        <p id="total-score">Pontos totais: 0</p>
    </header>

    <!-- TELA DE MENU / RANKING -->
    <div id="menu-view" class="active-view">
        <div id="topics-container"></div>
        
        <div class="rewards-container">
            <h3>🏆 Sala de Troféus</h3>
            <div id="badges-container"></div>
        </div>
    </div>

    <!-- TELA DE QUIZ (FLASHCARD) -->
    <div id="quiz-view">
        <h2 id="quiz-title" style="margin-bottom: 15px; color: #555;">Tema</h2>
        <div class="card" id="question-text">Pergunta vai aqui?</div>
        
        <div class="options" id="options-container"></div>
        
        <div id="explanation"></div>
        
        <button class="control-btn" id="btn-explanation" onclick="showExplanation()" style="display:none; background: #f39c12;">💡 Ver Explicação</button>
        <button class="control-btn" id="btn-next" onclick="nextQuestion()" style="display:none; background: var(--success);">Próxima Questão ➔</button>
        <button class="control-btn" onclick="showMenu()" style="background: #95a5a6; margin-top: 10px;">Voltar ao Menu</button>
    </div>

    <script>
        // 1. BANCO DE QUESTÕES (Fácil de expandir futuramente)
        const db = {
            fracoes: {
                title: "Frações",
                questions: [
                    { q: "Qual fração representa a metade de uma pizza?", options: ["1/4", "1/2", "2/3", "3/4"], answer: 1, exp: "A metade significa dividir o inteiro em 2 partes iguais e pegar 1. Portanto, 1/2." },
                    { q: "O que é maior: 3/4 ou 1/4?", options: ["3/4", "1/4", "São iguais", "Depende"], answer: 0, exp: "Como os denominadores (4) são iguais, basta olhar o numerador. 3 é maior que 1." },
                    { q: "Quanto é 1/3 de 30 figurinhas?", options: ["10", "15", "20", "30"], answer: 0, exp: "Para achar 1/3 de uma quantidade, dividimos o total pelo denominador (30 ÷ 3 = 10) e multiplicamos pelo numerador (10 × 1 = 10)." },
                    { q: "Qual é o resultado de 2/5 + 1/5?", options: ["3/10", "2/25", "3/5", "1/5"], answer: 2, exp: "Na adição com o mesmo denominador, mantemos o denominador (5) e somamos apenas os numeradores (2 + 1 = 3)." }
                ]
            },
            medidas: {
                title: "Combinações e Medidas",
                questions: [
                    { q: "Quantos centímetros tem 1 metro?", options: ["10 cm", "100 cm", "1000 cm", "1 cm"], answer: 1, exp: "A palavra 'centi'metro significa a centésima parte do metro. Portanto, 1 metro tem exatos 100 centímetros." },
                    { q: "Se eu tenho 3 camisas e 2 calças, quantas combinações diferentes posso fazer?", options: ["5", "6", "9", "3"], answer: 1, exp: "Usamos a multiplicação para combinações: 3 camisas × 2 calças = 6 combinações possíveis." },
                    { q: "O que é mais pesado: 1 Quilograma (kg) ou 800 gramas (g)?", options: ["1 Kg", "800 g", "São iguais", "Não dá para saber"], answer: 0, exp: "1 Quilograma equivale a 1000 gramas. Como 1000g é maior que 800g, 1 Kg é mais pesado." }
                ]
            },
            multiplos: {
                title: "Múltiplos e Divisores",
                questions: [
                    { q: "Quais são os 3 primeiros múltiplos de 5?", options: ["1, 2, 3", "5, 10, 15", "10, 20, 30", "5, 6, 7"], answer: 1, exp: "Os múltiplos de 5 são os resultados da tabuada do 5: 5x1=5, 5x2=10, 5x3=15." },
                    { q: "O número 12 é divisível por quais destes números?", options: ["Apenas por 2", "Apenas por 3", "Por 2, 3 e 4", "Por 5"], answer: 2, exp: "12 pode ser dividido perfeitamente por 2 (dá 6), por 3 (dá 4) e por 4 (dá 3)." },
                    { q: "Qual é o maior divisor comum entre 8 e 12?", options: ["2", "4", "8", "6"], answer: 1, exp: "Os divisores de 8 são: 1, 2, 4, 8. Os divisores de 12 são: 1, 2, 3, 4, 6, 12. O maior número que aparece nas duas listas é o 4." }
                ]
            }
        };

        // 2. SISTEMA DE METAS E RECOMPENSAS
        const goals = [
            { id: "first_blood", req: 1, name: "🌟 Primeiro Acerto!" },
            { id: "math_apprentice", req: 10, name: "📚 Aprendiz de Matemática (10 acertos)" },
            { id: "math_ninja", req: 50, name: "🥷 Ninja dos Números (50 acertos)" },
            { id: "math_master", req: 100, name: "👑 Mestre Calculista (100 acertos)" } // Você pode amarrar isso a um prêmio no mundo real
        ];

        // 3. LÓGICA DE ESTADO E STORAGE
        let progress = JSON.parse(localStorage.getItem('mathProgress')) || {};
        let currentTopic = '';
        let currentQIndex = 0;
        let pool = [];
        let hasAnswered = false;

        function initApp() {
            const container = document.getElementById('topics-container');
            container.innerHTML = '';
            let totalCorrect = 0;

            for (const key in db) {
                if (!progress[key]) progress[key] = { correct: 0, wrong: 0 };
                totalCorrect += progress[key].correct;
                
                const btn = document.createElement('button');
                btn.className = 'topic-btn';
                btn.innerHTML = `${db[key].title} <span class="stats">✅ ${progress[key].correct} | ❌ ${progress[key].wrong}</span>`;
                btn.onclick = () => startTopic(key);
                container.appendChild(btn);
            }
            
            document.getElementById('total-score').innerText = `Acertos Totais: ${totalCorrect}`;
            renderBadges(totalCorrect);
        }

        function renderBadges(totalCorrect) {
            const container = document.getElementById('badges-container');
            container.innerHTML = '';
            goals.forEach(g => {
                const badge = document.createElement('span');
                badge.className = `badge ${totalCorrect >= g.req ? 'unlocked' : ''}`;
                badge.innerText = g.name;
                container.appendChild(badge);
            });
        }

        function saveProgress() {
            localStorage.setItem('mathProgress', JSON.stringify(progress));
        }

        // 4. LÓGICA DO QUIZ
        function startTopic(key) {
            currentTopic = key;
            pool = [...db[key].questions].sort(() => Math.random() - 0.5); // Embaralha as questões
            currentQIndex = 0;
            document.getElementById('menu-view').classList.remove('active-view');
            document.getElementById('quiz-view').classList.add('active-view');
            document.getElementById('quiz-title').innerText = db[key].title;
            loadQuestion();
        }

        function loadQuestion() {
            hasAnswered = false;
            const q = pool[currentQIndex];
            document.getElementById('question-text').innerText = q.q;
            document.getElementById('explanation').style.display = 'none';
            document.getElementById('btn-explanation').style.display = 'none';
            document.getElementById('btn-next').style.display = 'none';
            
            const optionsDiv = document.getElementById('options-container');
            optionsDiv.innerHTML = '';
            
            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(index, btn);
                optionsDiv.appendChild(btn);
            });
        }

        function checkAnswer(selectedIndex, btnElement) {
            if (hasAnswered) return;
            hasAnswered = true;
            
            const q = pool[currentQIndex];
            const isCorrect = selectedIndex === q.answer;
            const options = document.getElementById('options-container').children;

            if (isCorrect) {
                btnElement.classList.add('correct');
                progress[currentTopic].correct++;
            } else {
                btnElement.classList.add('wrong');
                options[q.answer].classList.add('correct'); // Mostra a certa
                progress[currentTopic].wrong++;
            }

            saveProgress();
            document.getElementById('btn-explanation').style.display = 'block';
            document.getElementById('btn-next').style.display = 'block';
        }

        function showExplanation() {
            const expDiv = document.getElementById('explanation');
            expDiv.innerText = pool[currentQIndex].exp;
            expDiv.style.display = 'block';
            document.getElementById('btn-explanation').style.display = 'none';
        }

        function nextQuestion() {
            currentQIndex++;
            if (currentQIndex < pool.length) {
                loadQuestion();
            } else {
                alert("Você completou as questões deste tema! Voltando ao menu para ver sua evolução.");
                showMenu();
            }
        }

        function showMenu() {
            document.getElementById('quiz-view').classList.remove('active-view');
            document.getElementById('menu-view').classList.add('active-view');
            initApp();
        }

        // Inicia o app
        initApp();
    </script>
</body>
</html>
